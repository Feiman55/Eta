name: Local Release APK

# 仅构建签名 Release APK，跳过 lint/单测，用于自编译分发。
# 与上游 android-release.yml 独立，新增文件不影响同步。
on:
  push:
    branches:
      - local/voice-tile
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: 还原发布证书
        env:
          ETA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$ETA_RELEASE_KEYSTORE_BASE64" ||
                -z "$ETA_RELEASE_STORE_PASSWORD" ||
                -z "$ETA_RELEASE_KEY_ALIAS" ||
                -z "$ETA_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::缺少 Release 签名 Secrets。"
            exit 1
          fi
          printf '%s' "$ETA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eta-release.jks"

      - name: 构建 Release APK
        env:
          ETA_RELEASE_STORE_FILE: ${{ runner.temp }}/eta-release.jks
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          ./.gradlew --no-daemon --no-configuration-cache \
            "-Peta.buildMetadata=${GITHUB_SHA::7}" \
            :app:assembleRelease

      - name: 校验并整理 APK
        id: apk
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/Eta-*.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Release APK 数量异常（${#apks[@]}）。"
            ls -R app/build/outputs || true
            exit 1
          fi
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$apksigner_path" verify "${apks[0]}"
          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${apks[0]}")" >> "$GITHUB_OUTPUT"

      - name: 上传 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
